events {}

http {
    proxy_cache_path /var/cache/nginx
                     levels=1:2
                     keys_zone=my_cache:10m
                     max_size=100m
                     inactive=60m
                     use_temp_path=off;

    server {
        listen 80;

        location / {
            proxy_cache my_cache;

            proxy_pass http://host.docker.internal:3000;

            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}